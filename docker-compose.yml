version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: uav_db
    environment:
      MYSQL_ROOT_PASSWORD: a_very_strong_root_password
      MYSQL_DATABASE: exam_site_dev_db
      MYSQL_USER: dev_user
      MYSQL_PASSWORD: a_good_password_for_dev
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    networks:
      - uav_network

  redis:
    image: redis:7-alpine
    container_name: uav_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - uav_network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: uav_backend
    environment:
      - DATABASE_URL=mysql+pymysql://dev_user:a_good_password_for_dev@db:3306/exam_site_dev_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=a_random_string_for_docker_production
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - DEBUG=true
      - MYSQL_USER=dev_user
      - MYSQL_PASSWORD=a_good_password_for_dev
      - MYSQL_DATABASE=exam_site_dev_db
      - MYSQL_ROOT_PASSWORD=a_very_strong_root_password
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=dev_user
      - DB_PASSWORD=a_good_password_for_dev
      - DB_NAME=exam_site_dev_db
      - EXTERNAL_DB_PORT=3307
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    restart: unless-stopped
    networks:
      - uav_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uav_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - uav_network

  nginx:
    image: nginx:alpine
    container_name: uav_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/certs:/etc/nginx/certs
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - uav_network

volumes:
  mysql_data:
  redis_data:
  uploads_data:

networks:
  uav_network:
    driver: bridge